<!doctype html>
<html lang="zh-CN">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <title>mota-js 3.0</title>
        <link rel="icon" href="data:," />
        <style>
            :root {
                --panel: #23252b;
                --border: #4a4e59;
            }
            body {
                margin: 0;
                background: #111;
                color: #eee;
                font-family: system-ui, sans-serif;
                display: flex;
                flex-direction: column;
                align-items: center;
                gap: 10px;
                padding: 16px;
            }
            #game {
                image-rendering: pixelated;
                background: #000;
            }
            button {
                padding: 6px 14px;
                cursor: pointer;
            }
            .panel {
                width: 100%;
                box-sizing: border-box;
                background: var(--panel);
                border: 1px solid var(--border);
                border-radius: 6px;
                padding: 8px 10px;
            }
            #status-bar {
                display: flex;
                flex-wrap: wrap;
                gap: 4px 14px;
                font-size: 14px;
            }
            .status-slot {
                display: flex;
                gap: 4px;
                align-items: baseline;
            }
            .status-label {
                color: #9aa0ad;
                font-size: 12px;
            }
            .status-value {
                font-weight: 600;
                min-width: 1.6em;
            }
            #status-counters {
                margin-top: 6px;
                font-size: 13px;
                color: #cfd4de;
            }

            /* 对话框：文字、标题、选择项、提示 */
            #dialog {
                position: fixed;
                left: 50%;
                bottom: 24px;
                transform: translateX(-50%);
                width: min(560px, 92vw);
                background: rgba(18, 18, 22, 0.94);
                border: 2px solid var(--border);
                border-radius: 8px;
                padding: 12px 16px;
                line-height: 1.6;
                box-shadow: 0 8px 28px rgba(0, 0, 0, 0.5);
            }
            #dialog[hidden] {
                display: none;
            }
            .dialog-title {
                font-weight: 700;
                color: #ffd479;
                margin-bottom: 4px;
            }
            .dialog-text {
                white-space: pre-wrap;
                min-height: 1.6em;
            }
            .dialog-choices {
                display: flex;
                flex-direction: column;
                gap: 6px;
                margin-top: 10px;
            }
            .dialog-choices button {
                text-align: left;
            }
            .dialog-choices input {
                padding: 6px 8px;
                font-size: 14px;
            }
            .dialog-tip {
                margin-top: 8px;
                padding-top: 8px;
                border-top: 1px dashed var(--border);
                color: #9ad9ff;
                font-size: 13px;
            }
            .dialog-tip-fade {
                animation: tip-fade 1.6s ease-out 1.4s forwards;
            }
            @keyframes tip-fade {
                to {
                    opacity: 0;
                }
            }
            .mota-inline-icon::before {
                content: '\25a1';
            }

            /* 面板：怪物手册等（旧引擎的 canvas 面板，这里先用 DOM 文本呈现） */
            #panel {
                position: fixed;
                inset: 0;
                background: rgba(0, 0, 0, 0.6);
                display: flex;
                align-items: center;
                justify-content: center;
                z-index: 10;
            }
            #panel[hidden] {
                display: none;
            }
            .panel-box {
                width: min(560px, 92vw);
                max-height: 80vh;
                overflow: auto;
                background: #1b1d23;
                border: 2px solid var(--border);
                border-radius: 8px;
                padding: 14px 18px;
                box-shadow: 0 8px 28px rgba(0, 0, 0, 0.6);
            }
            .panel-box h2 {
                margin: 0 0 8px;
                font-size: 16px;
                color: #ffd479;
            }
            .panel-box .panel-line {
                line-height: 1.6;
                white-space: pre-wrap;
            }
            .panel-box .panel-hint {
                margin-top: 10px;
                color: #9aa0ad;
                font-size: 13px;
            }
        </style>
    </head>
    <body>
        <h1>mota-js 3.0</h1>
        <div class="panel">
            <div id="status-bar"></div>
            <div id="status-counters" hidden></div>
        </div>
        <div>
            <button id="save">存档</button>
            <button id="load">读档</button>
        </div>
        <canvas id="game" width="416" height="416"></canvas>
        <div id="dialog" hidden></div>
        <div id="panel" hidden></div>
        <script type="module" src="./main.ts"></script>
    </body>
</html>
